<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Booking - Hotel Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <h2>Hotel Management System</h2>
        <ul>
            <li><a href="/rooms.html">Rooms</a></li>
            <li><a href="/create-booking.html" class="active">Create Booking</a></li>
            <li><a href="/booking-history.html">My Booking History</a></li>
            <li><a href="/payment.html">Payment</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Create New Room Booking</h1>

            <p class="subtitle">
                Create a new hotel room reservation.
            </p>

            <form id="bookingForm">

                <div class="form-group">
                    <label>MongoDB Room ID</label>
                    <input
                        type="text"
                        id="roomId"
                        placeholder="Enter Room ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Guest Full Name</label>
                    <input
                        type="text"
                        id="guestName"
                        placeholder="e.g. Nimal Perera"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Check-In Date</label>
                    <input
                        type="date"
                        id="checkInDate"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Check-Out Date</label>
                    <input
                        type="date"
                        id="checkOutDate"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Total Amount (LKR)</label>
                    <input
                        type="number"
                        id="totalAmount"
                        placeholder="e.g. 15000"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn"
                    style="width: 100%;"
                >
                    Submit Booking Request
                </button>

            </form>

            <div id="alertBox" class="alert"></div>
        </div>
    </div>


    <script>

        // Relative API URL works with both
        // localhost and ngrok HTTPS
        const BOOKING_API_URL = '/api/bookings';

        const API_KEY = 'hotel_secret_key_123';


        // ==========================================
        // AUTO FILL ROOM ID
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const urlRoomId =
            urlParams.get('roomId');

        if (urlRoomId) {
            document.getElementById(
                'roomId'
            ).value = urlRoomId;
        }


        // ==========================================
        // CREATE BOOKING
        // ==========================================

        document.getElementById(
            'bookingForm'
        ).addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();

                const alertBox =
                    document.getElementById(
                        'alertBox'
                    );

                alertBox.style.display =
                    'none';


                const payload = {

                    roomId:
                        document.getElementById(
                            'roomId'
                        ).value.trim(),

                    guestName:
                        document.getElementById(
                            'guestName'
                        ).value.trim(),

                    checkInDate:
                        document.getElementById(
                            'checkInDate'
                        ).value,

                    checkOutDate:
                        document.getElementById(
                            'checkOutDate'
                        ).value,

                    totalAmount:
                        Number(
                            document.getElementById(
                                'totalAmount'
                            ).value
                        )
                };


                try {

                    const response =
                        await fetch(
                            BOOKING_API_URL,
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json',

                                    'x-api-key':
                                        API_KEY
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        response.ok &&
                        result.success
                    ) {

                        alertBox.className =
                            'alert alert-success';

                        alertBox.innerText =
                            '🎉 Booking Created Successfully!';

                        alertBox.style.display =
                            'block';


                        document.getElementById(
                            'bookingForm'
                        ).reset();


                        // Optional redirect to history
                        setTimeout(() => {

                            window.location.href =
                                '/booking-history.html';

                        }, 1500);


                    } else {

                        alertBox.className =
                            'alert alert-error';

                        alertBox.innerText =
                            `Error: ${
                                result.message ||
                                'Failed to create booking'
                            }`;

                        alertBox.style.display =
                            'block';
                    }


                } catch (error) {

                    console.error(error);

                    alertBox.className =
                        'alert alert-error';

                    alertBox.innerText =
                        'Server Error: Unable to complete booking request.';

                    alertBox.style.display =
                        'block';
                }

            }
        );

    </script>

</body>
</html>
